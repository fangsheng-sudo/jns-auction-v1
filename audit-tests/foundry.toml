[profile.default]
# 符号链接 → ../jns-auction/contracts（被测合约，零改动、只读引用）
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.0"
evm_version = "istanbul"
optimizer = true
optimizer_runs = 200
via_ir = false
auto_detect_solc = false

[fuzz]
runs = 256

[invariant]
runs = 10000
depth = 64
fail_on_revert = false
